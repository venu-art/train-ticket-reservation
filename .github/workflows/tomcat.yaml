
name: CI Pipeline to Build Java Code

on:
  push:
    branches:
      - master

jobs:

  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:

   
      - name: Checkout code
        uses: actions/checkout@v5

  
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate with Maven
        run: mvn validate

 
      - name: Compile with Maven
        run: mvn compile


      - name: Test with Maven
        run: mvn test


      - name: Package with Maven
        run: mvn clean package

      - name: Verify WAR file
        run: |
          ls -lh target/
          test -f target/TrainBook-1.0.0-SNAPSHOT.war

      # Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/TrainBook-1.0.0-SNAPSHOT.war
          if-no-files-found: error
          retention-days: 7


  # ==================================
  # DEPLOY TO DEV ENVIRONMENT
  # ==================================

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: developer

    steps:

      # Download WAR artifact
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      # Deploy WAR to DEV Tomcat
      - name: Deploy WAR to DEV Tomcat
        run: |
          curl --fail --show-error \
          -u "${{ secrets.DEV_TOMCAT_USERNAME }}:${{ secrets.DEV_TOMCAT_PASSWORD }}" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.DEV_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO TEST ENVIRONMENT
  # ==================================

  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: tester

    steps:

      # Download WAR artifact
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      # Deploy WAR to TEST Tomcat
      - name: Deploy WAR to TEST Tomcat
        run: |
          curl --fail --show-error \
          -u "${{ secrets.TEST_TOMCAT_USERNAME }}:${{ secrets.TEST_TOMCAT_PASSWORD }}" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.TEST_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO PRE-PROD ENVIRONMENT
  # ==================================

  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: preprod

    steps:

      # Download WAR artifact
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      # Deploy WAR to PRE-PROD Tomcat
      - name: Deploy WAR to PRE-PROD Tomcat
        run: |
          curl --fail --show-error \
          -u "${{ secrets.PREPROD_TOMCAT_USERNAME }}:${{ secrets.PREPROD_TOMCAT_PASSWORD }}" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.PREPROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO PROD ENVIRONMENT
  # ==================================

  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod

    steps:

      # Download WAR artifact
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      # Deploy WAR to PROD Tomcat
      - name: Deploy WAR to PROD Tomcat
        run: |
          curl --fail --show-error \
          -u "${{ secrets.PROD_TOMCAT_USERNAME }}:${{ secrets.PROD_TOMCAT_PASSWORD }}" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.PROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
