
name: CI CD Pipeline - Four Environments

on:
  push:
    branches:
      - master

jobs:

  # ==================================
  # BUILD JAVA APPLICATION
  # ==================================

  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      # Setup Java 17
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Install Maven
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install maven -y

      # Check versions
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # Validate
      - name: Validate with Maven
        run: mvn validate

      # Compile
      - name: Compile with Maven
        run: mvn compile

      # Test
      - name: Test with Maven
        run: mvn test

      # Generate WAR
      - name: Package with Maven
        run: mvn clean package

      # Verify WAR
      - name: Verify WAR file
        run: |
          ls -lh target/
          test -f target/TrainBook-1.0.0-SNAPSHOT.war

      # Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/TrainBook-1.0.0-SNAPSHOT.war
          if-no-files-found: error
          retention-days: 7


  # ==================================
  # DEPLOY TO DEV
  # ==================================

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: developer

    steps:

      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      - name: Validate DEV host
        env:
          TOMCAT_HOST: ${{ secrets.DEV_TOMCAT_HOST }}
        run: |
          if [ -z "$TOMCAT_HOST" ]; then
            echo "DEV host is empty"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" =~ [[:space:]] ]]; then
            echo "DEV host contains spaces"
            exit 1
          fi

          echo "DEV host format is valid"

      - name: Deploy WAR to DEV Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.DEV_TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.DEV_TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.DEV_TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
          -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO TEST
  # ==================================

  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: tester

    steps:

      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      - name: Validate TEST host
        env:
          TOMCAT_HOST: ${{ secrets.TEST_TOMCAT_HOST }}
        run: |
          if [ -z "$TOMCAT_HOST" ]; then
            echo "TEST host is empty"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" =~ [[:space:]] ]]; then
            echo "TEST host contains spaces"
            exit 1
          fi

          echo "TEST host format is valid"

      - name: Deploy WAR to TEST Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TEST_TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.TEST_TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TEST_TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
          -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO PRE-PROD
  # ==================================

  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prepod

    steps:

      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      - name: Validate PRE-PROD host
        env:
          TOMCAT_HOST: ${{ secrets.PREPROD_TOMCAT_HOST }}
        run: |
          if [ -z "$TOMCAT_HOST" ]; then
            echo "PRE-PROD host is empty"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" =~ [[:space:]] ]]; then
            echo "PRE-PROD host contains spaces"
            exit 1
          fi

          echo "PRE-PROD host format is valid"

      - name: Deploy WAR to PRE-PROD Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.PREPROD_TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.PREPROD_TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.PREPROD_TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
          -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"


  # ==================================
  # DEPLOY TO PROD
  # ==================================

  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod

    steps:

      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      - name: Validate PROD host
        env:
          TOMCAT_HOST: ${{ secrets.PROD_TOMCAT_HOST }}
        run: |
          if [ -z "$TOMCAT_HOST" ]; then
            echo "PROD host is empty"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" =~ [[:space:]] ]]; then
            echo "PROD host contains spaces"
            exit 1
          fi

          echo "PROD host format is valid"

      - name: Deploy WAR to PROD Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.PROD_TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.PROD_TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.PROD_TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
          -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"
