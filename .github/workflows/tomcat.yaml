
name: CI CD Pipeline - DEV Environment

on:
  push:
    branches:
      - master

jobs:

  # ==================================
  # BUILD JAVA APPLICATION
  # ==================================

  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Setup Java 17
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Install Maven
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install maven -y

      # Check versions
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # Validate project
      - name: Validate with Maven
        run: mvn validate

      # Compile Java code
      - name: Compile with Maven
        run: mvn compile

      # Test application
      - name: Test with Maven
        run: mvn test

      # Generate WAR file
      - name: Package with Maven
        run: mvn clean package

      # Verify WAR file
      - name: Verify WAR file
        run: |
          ls -lh target/
          test -f target/TrainBook-1.0.0-SNAPSHOT.war

      # Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/TrainBook-1.0.0-SNAPSHOT.war
          if-no-files-found: error
          retention-days: 7


  # ==================================
  # DEPLOY TO DEV ENVIRONMENT
  # ==================================

  deploy-dev:
    name: Deploy to DEV Tomcat
    needs: build
    runs-on: ubuntu-latest
    environment: developer

    steps:

      # Download WAR artifact
      - name: Download WAR file
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target/

      # Validate DEV host
      - name: Validate DEV host
        env:
          TOMCAT_HOST: ${{ secrets.DEV_TOMCAT_HOST }}
        run: |
          if [ -z "$TOMCAT_HOST" ]; then
            echo "ERROR: DEV host is empty"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" =~ [[:space:]] ]]; then
            echo "ERROR: DEV host contains spaces"
            exit 1
          fi

          if [[ "$TOMCAT_HOST" == http://* || "$TOMCAT_HOST" == https://* ]]; then
            echo "ERROR: Enter only the IP address or hostname"
            exit 1
          fi

          echo "DEV host format is valid"

      # Deploy WAR to DEV Tomcat
      - name: Deploy WAR to DEV Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.DEV_TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.DEV_TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.DEV_TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
          -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
          -T target/TrainBook-1.0.0-SNAPSHOT.war \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"
